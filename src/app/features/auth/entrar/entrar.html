<main class="entrar">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Secretaria Escolar</mat-card-title>
      <mat-card-subtitle>Entre com o seu e-mail e a sua senha</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="entrar()" novalidate>
        <mat-form-field appearance="outline">
          <mat-label>E-mail</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="username" required />
          @if (form.controls.email.hasError('required')) {
            <mat-error>Informe o e-mail</mat-error>
          } @else if (form.controls.email.hasError('email')) {
            <mat-error>E-mail inválido</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Senha</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" required />
          <mat-error>Informe a senha</mat-error>
        </mat-form-field>

        @if (erro(); as mensagem) {
          <p class="erro" role="alert">{{ mensagem }}</p>
        }

        <button mat-flat-button type="submit" [disabled]="enviando()">
          {{ enviando() ? 'Entrando...' : 'Entrar' }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</main>
