<div class="mesa">
  <div class="topo">
    <div class="marca">
      <span class="livro">Livro de matrículas</span>
      <span class="nome">Secretaria Escolar</span>
    </div>
    <div class="usuario">
      <span class="perfil">{{ auth.role() }}</span>
      <button class="menu-botao" mat-stroked-button type="button" [attr.aria-expanded]="menuAberto()" aria-controls="menu-principal" (click)="menuAberto.set(!menuAberto())">Menu</button>
      <button mat-stroked-button type="button" (click)="auth.logout()">Sair</button>
    </div>
  </div>

  <nav id="menu-principal" aria-label="Principal" [class.aberto]="menuAberto()">
    @for (item of itens(); track item.rota) {
      <a [routerLink]="item.rota" routerLinkActive="ativa" ariaCurrentWhenActive="page" (click)="menuAberto.set(false)">{{ item.rotulo }}</a>
    }
  </nav>

  <app-folha>
    <main><router-outlet /></main>
  </app-folha>
</div>
